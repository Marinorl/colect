name: Tracker Colectivos

on:
  workflow_dispatch: # Disparo manual
  schedule:
    # 03:00, 03:15 y 03:45 ART (06:00, 06:15, 06:45 UTC)
    - cron: '0,15,45 6 * * *'
    
    # 04:00, 04:15, 04:30 y 04:45 ART (07:00, 07:15, 07:30, 07:45 UTC)
    - cron: '0,15,30,45 7 * * *'
    
    # 05:30 ART (08:30 UTC)
    - cron: '30 8 * * *'

concurrency:
  group: scraping-job
  cancel-in-progress: false

jobs:
  scrape-and-encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Descifrar CSV existente si existe
        env:
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -f "llegadas_colectivos.csv.gpg" ]; then
            gpg --batch --yes --passphrase "$PASSPHRASE" -d llegadas_colectivos.csv.gpg > llegadas_colectivos.csv
          fi

      - name: Ejecutar scraping puntual
        run: |
          python scraper.py

      - name: Cifrar CSV resultante
        env:
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$PASSPHRASE" \
              --symmetric --cipher-algo AES256 \
              -o llegadas_colectivos.csv.gpg llegadas_colectivos.csv

      - name: Commitear cambios cifrados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add llegadas_colectivos.csv.gpg
          if git diff --staged --quiet; then
            echo "Sin datos nuevos."
          else
            git commit -m "Registro automático [skip ci]"
            git push
          fi
