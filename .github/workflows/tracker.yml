name: Tracker Colectivos

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: scraping-job
  cancel-in-progress: false

jobs:
  scrape-and-encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Descifrar CSV existente si existe
        env:
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -f "llegadas_colectivos.csv.gpg" ]; then
            gpg --batch --yes --passphrase "$PASSPHRASE" -d llegadas_colectivos.csv.gpg > llegadas_colectivos.csv
          fi

      - name: Ejecutar scraping puntual
        run: |
          python scraper.py

      - name: Cifrar CSV resultante
        env:
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$PASSPHRASE" \
              --symmetric --cipher-algo AES256 \
              -o llegadas_colectivos.csv.gpg llegadas_colectivos.csv

      - name: Commitear cambios cifrados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add llegadas_colectivos.csv.gpg
          if git diff --staged --quiet; then
            echo "Sin datos nuevos."
          else
            git commit -m "Update dataset [skip ci]"
            git push
          fi
